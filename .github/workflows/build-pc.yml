name: Build PC
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: copy app\src\main\assets\inject.js desktop\inject.js
      - run: npm install
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: HaxBall Boost PC
          files: desktop/dist/*.exe
