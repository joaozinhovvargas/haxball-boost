name: Build PC
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copiar inject.js do app Android
        run: copy app\src\main\assets\inject.js desktop\inject.js
      - name: Instalar dependencias
        run: npm install
        working-directory: desktop
      - name: Gerar instalador
        run: npm run dist
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: HaxBallBoost-PC
          path: desktop/dist/*.exe
          if-no-files-found: error
